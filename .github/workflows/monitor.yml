name: 数据完整性监控与自愈

on:
  schedule:
    # 北京时间 16:05 = UTC 08:05，主爬虫后30分钟做最终核验
    - cron: '5 8 * * 1-5'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 交易日历判断
        id: trade_check
        run: |
          TODAY=$(TZ='Asia/Shanghai' date '+%Y-%m-%d')
          WEEKDAY=$(TZ='Asia/Shanghai' date '+%u')
          echo "TODAY=$TODAY" >> $GITHUB_ENV

          if [ "$WEEKDAY" = "6" ] || [ "$WEEKDAY" = "7" ]; then
            echo "is_trading_day=false" >> $GITHUB_OUTPUT
            echo "周末，跳过"
            exit 0
          fi

          HOLIDAYS="2026-01-01 2026-01-02 2026-01-28 2026-01-29 2026-01-30 2026-01-31 2026-02-01 2026-02-02 2026-02-03 2026-02-04 2026-02-05 2026-02-06 2026-02-07 2026-04-04 2026-04-05 2026-04-06 2026-05-01 2026-05-02 2026-05-03 2026-05-04 2026-05-05 2026-06-19 2026-06-20 2026-09-25 2026-10-01 2026-10-02 2026-10-03 2026-10-04 2026-10-05 2026-10-06 2026-10-07 2026-10-08"

          for h in $HOLIDAYS; do
            if [ "$TODAY" = "$h" ]; then
              echo "is_trading_day=false" >> $GITHUB_OUTPUT
              echo "节假日 $TODAY，跳过"
              exit 0
            fi
          done

          echo "is_trading_day=true" >> $GITHUB_OUTPUT

      - name: 检查今日数据完整性
        if: steps.trade_check.outputs.is_trading_day == 'true'
        id: check
        run: |
          TODAY=$(TZ='Asia/Shanghai' date '+%Y-%m-%d')
          echo "检查日期: $TODAY"
          THS=$(python3 -c "
          import sqlite3
          conn = sqlite3.connect('fund_flow.db')
          n = conn.execute('SELECT COUNT(*) FROM sector_flow_ths WHERE date=?', ('$TODAY',)).fetchone()[0]
          conn.close()
          print(n)
          ")
          RECO=$(python3 -c "
          import sqlite3
          conn = sqlite3.connect('fund_flow.db')
          n = conn.execute('SELECT COUNT(*) FROM stock_reco WHERE date=?', ('$TODAY',)).fetchone()[0]
          conn.close()
          print(n)
          ")
          echo "THS板块=$THS 条，个股推荐=$RECO 条"
          echo "ths_count=$THS" >> $GITHUB_OUTPUT
          if [ "$THS" = "0" ]; then
            echo "missing=true" >> $GITHUB_OUTPUT
            echo "⚠️ 同花顺数据缺失，将触发自愈重跑"
          else
            echo "missing=false" >> $GITHUB_OUTPUT
            echo "✅ 数据完整，无需干预"
          fi

      - name: 安装依赖（仅数据缺失时）
        if: steps.check.outputs.missing == 'true' && steps.trade_check.outputs.is_trading_day == 'true'
        run: pip install curl_cffi py-mini-racer requests akshare yfinance

      - name: 自愈重跑爬虫
        if: steps.check.outputs.missing == 'true' && steps.trade_check.outputs.is_trading_day == 'true'
        run: python scraper.py
        timeout-minutes: 15

      - name: 重新导出 JSON
        if: steps.check.outputs.missing == 'true' && steps.trade_check.outputs.is_trading_day == 'true'
        run: python export_json.py

      - name: 验证自愈结果
        if: steps.check.outputs.missing == 'true' && steps.trade_check.outputs.is_trading_day == 'true'
        run: |
          TODAY=$(TZ='Asia/Shanghai' date '+%Y-%m-%d')
          python3 -c "
          import sqlite3, sys
          conn = sqlite3.connect('fund_flow.db')
          ths = conn.execute('SELECT COUNT(*) FROM sector_flow_ths WHERE date=?', ('$TODAY',)).fetchone()[0]
          conn.close()
          print(f'自愈后 THS={ths}条')
          if ths == 0:
              print('❌ 自愈失败，数据仍为空')
              sys.exit(1)
          else:
              print('✅ 自愈成功')
          "

      - name: 提交修复后的数据
        if: steps.check.outputs.missing == 'true' && steps.trade_check.outputs.is_trading_day == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ fund_flow.db
          git diff --cached --quiet || git commit -m "监控自愈: 补全 $(TZ='Asia/Shanghai' date '+%Y-%m-%d') 数据"
          git push

      - name: 飞书告警（自愈失败时通知）
        if: failure() && steps.trade_check.outputs.is_trading_day == 'true'
        run: |
          TOKEN=$(curl -s -X POST "https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal" \
            -H "Content-Type: application/json" \
            -d "{\"app_id\":\"${{ secrets.FEISHU_APP_ID }}\",\"app_secret\":\"${{ secrets.FEISHU_APP_SECRET }}\"}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('tenant_access_token',''))")

          if [ -z "$TOKEN" ]; then
            echo "飞书 token 获取失败，跳过告警"
            exit 0
          fi

          TODAY=$(TZ='Asia/Shanghai' date '+%Y-%m-%d')
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          CARD=$(python3 -c "
          import json
          card = {
              'schema': '2.0',
              'header': {
                  'title': {'tag': 'plain_text', 'content': '⚠️ A股自愈失败 · $TODAY'},
                  'template': 'red'
              },
              'body': {
                  'elements': [
                      {'tag': 'div', 'text': {'tag': 'lark_md', 'content': '**日期**: $TODAY\n**问题**: 数据完整性监控自愈失败\n\n[查看运行日志]($RUN_URL)'}}
                  ]
              }
          }
          print(json.dumps(card))
          ")

          curl -s -X POST "https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type=open_id" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"receive_id\":\"${{ secrets.FEISHU_OPEN_ID }}\",\"msg_type\":\"interactive\",\"content\":$(echo "$CARD" | python3 -c "import sys,json; print(json.dumps(json.load(sys.stdin)))")}" \
            > /dev/null 2>&1

          echo "飞书告警已发送"
