name: 月度策略深度优化

on:
  schedule:
    # 每月1日 北京时间 16:30 = UTC 08:30
    - cron: '30 8 1 * *'
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install curl_cffi py-mini-racer requests akshare yfinance

      - name: 月度深度分析与权重优化
        run: |
          python3 - << 'EOF'
          import sqlite3, json
          from datetime import date, timedelta
          from pathlib import Path

          conn = sqlite3.connect('fund_flow.db')
          today = date.today().strftime('%Y-%m-%d')
          month_ago = (date.today() - timedelta(days=35)).strftime('%Y-%m-%d')

          # ── 近30个交易日复盘数据汇总 ──
          reviews = conn.execute("""
              SELECT review_date, total_reco, up_count, win_rate, avg_gain,
                     max_gain, max_loss, strategy_score, detail_json
              FROM strategy_review
              WHERE review_date >= ? ORDER BY review_date
          """, (month_ago,)).fetchall()

          print(f"\n{'='*60}")
          print(f"  月度策略分析报告 ({month_ago} ~ {today})")
          print(f"{'='*60}")
          print(f"  有效复盘天数: {len(reviews)} 天")

          if len(reviews) < 5:
              print("  数据不足5天，跳过优化")
              conn.close()
              exit(0)

          # 汇总统计
          total_reco = sum(r[1] for r in reviews)
          total_up   = sum(r[2] for r in reviews)
          avg_win    = total_up / total_reco if total_reco else 0
          avg_gain   = sum(r[4] for r in reviews) / len(reviews)
          avg_score  = sum(r[7] for r in reviews) / len(reviews)

          print(f"  推荐总数: {total_reco} 只")
          print(f"  月均胜率: {avg_win*100:.1f}%")
          print(f"  月均涨幅: {avg_gain:+.2f}%")
          print(f"  月均策略评分: {avg_score:.2f}/5")

          # ── 信号命中率累积分析 ──
          signal_wins   = {}
          signal_totals = {}
          for r in reviews:
              detail = json.loads(r[8]) if r[8] else {}
              for sig, rate in detail.get('signal_stats', {}).items():
                  if rate is not None:
                      signal_wins[sig]   = signal_wins.get(sig, 0)   + rate
                      signal_totals[sig] = signal_totals.get(sig, 0) + 1

          print("\n  各信号30日平均命中率:")
          sig_avg = {}
          for sig in signal_totals:
              avg = signal_wins[sig] / signal_totals[sig]
              sig_avg[sig] = round(avg, 1)
              bar = '█' * int(avg / 5)
              print(f"    {sig:20s}: {avg:5.1f}%  {bar}")

          # ── 基于命中率重算权重（月度版：更保守，平滑30天）──
          base_weights = {
              'macd_golden': 4, 'macd_death': -3, 'macd_zero': -1,
              'ma_align': 1, 'rsi_healthy': 1, 'rsi_overbought': -2,
              'vol_moderate': 1, 'yang_cross_2': 2, 'yang_cross_1': 1,
              'pullback_10d': 1,
          }
          sig_to_weight = {
              'macd_golden': 'macd_golden', 'ma_align': 'ma_align',
              'macd_zero': 'macd_zero', 'vol_2x': 'vol_moderate',
              'yang_cross': 'yang_cross_2', 'pullback_10d': 'pullback_10d',
          }
          new_weights = dict(base_weights)
          for sig, rate in sig_avg.items():
              wkey = sig_to_weight.get(sig)
              if not wkey: continue
              base = base_weights.get(wkey, 1)
              # 月度权重：命中率 > 65% 加权，< 45% 降权，平滑调整
              if rate > 65:
                  new_weights[wkey] = round(base * 1.3, 1)
              elif rate > 55:
                  new_weights[wkey] = round(base * 1.1, 1)
              elif rate < 45:
                  new_weights[wkey] = round(base * 0.75, 1)
              elif rate < 35:
                  new_weights[wkey] = round(base * 0.5, 1)

          # 月度评估等级
          if avg_win >= 0.65 and avg_gain >= 1.5:
              grade = 'A（优秀）'
              notes = f"月均胜率{avg_win*100:.0f}%，涨幅{avg_gain:+.2f}%，策略表现优异"
          elif avg_win >= 0.55:
              grade = 'B（良好）'
              notes = f"月均胜率{avg_win*100:.0f}%，策略稳健，继续积累数据"
          elif avg_win >= 0.45:
              grade = 'C（一般）'
              notes = f"月均胜率{avg_win*100:.0f}%，已调整权重，建议观察下月"
          else:
              grade = 'D（待优化）'
              notes = f"月均胜率{avg_win*100:.0f}%，已大幅调整权重，关注市场环境变化"

          print(f"\n  月度评级: {grade}")
          print(f"  优化备注: {notes}")
          print(f"  新权重: {new_weights}")

          # 写入 strategy_weights（月度版，sample_days 用负数标记为月度优化）
          conn.execute("""
              INSERT OR REPLACE INTO strategy_weights
              (weights_json, sample_days, notes, updated_date)
              VALUES (?, ?, ?, ?)
          """, (json.dumps(new_weights), -len(reviews),
                f"[月度优化] {grade} | {notes}", today))
          conn.commit()

          # 写月报到文件
          report = {
              'generated': today,
              'period': f"{month_ago}~{today}",
              'review_days': len(reviews),
              'total_reco': total_reco,
              'avg_win_rate': round(avg_win, 4),
              'avg_gain': round(avg_gain, 2),
              'avg_strategy_score': round(avg_score, 2),
              'grade': grade,
              'signal_avg': sig_avg,
              'new_weights': new_weights,
              'notes': notes,
          }
          Path('data').mkdir(exist_ok=True)
          with open('data/monthly_report.json', 'w', encoding='utf-8') as f:
              json.dump(report, f, ensure_ascii=False, indent=2)
          print(f"\n  ✅ 月报已写入 data/monthly_report.json")
          conn.close()
          EOF

      - name: 重新导出 JSON（含月报数据）
        run: python export_json.py

      - name: 提交月度优化结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ fund_flow.db
          git diff --cached --quiet || git commit -m "月度优化: $(date '+%Y-%m') 策略权重深度调整"
          git push
